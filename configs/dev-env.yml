# dev_env.yml - list of Homebrew tools
#
# Fields:
#   name:      tool identifier
#   manager:   package manager to use
#   manual:    true if manual install is required
#   platform:  target operating system

tools:
  - name: curl
    manager: homebrew
    manual: false
    platform: macos

  - name: git
    manager: homebrew
    manual: false
    platform: macos

  - name: htop
    manager: homebrew
    manual: false
    platform: macos

  - name: 1password-cli
    manager: homebrew
    manual: false
    platform: macos
